<!--
  concept-visualizer template — authoring notes
  ===============================================
  Copy the CSS + step-machine JS verbatim. Author real step content following
  the AUTHOR: comments. Strip all AUTHOR: comments from the final output file
  — they are instructions for the skill, not part of the artifact.

  The four gates (see SKILL.md) this scaffold enforces structurally:
  - Legend lives ABOVE step 1, declared once (rule 3: fixed color mapping).
  - Steps array holds ONE draw function + ONE caption each (rule 2: one
    metaphor — every step's draw() should transform the SAME objects, not
    introduce new ones).
  - transitionTo() lerps between step states over ~500ms (rule 4: continuity).
  - Step 0's draw() must contain no formula/notation — pure geometry (rule 1).
-->
<title>{Concept} — Visualized</title>
<style>
  :root {
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --ink: #1A2230;
    --muted: #5A6577;
    --line: #E3E7ED;
    --accent: #2F5D8A;       /* AUTHOR: pick per concept; keep AA contrast both themes */
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10151C; --surface: #171E27; --ink: #E4E9F0; --muted: #8A94A5; --line: #242D3A; --accent: #6FA8D6; }
  }
  :root[data-theme="light"] { --bg: #F6F7F9; --surface: #FFFFFF; --ink: #1A2230; --muted: #5A6577; --line: #E3E7ED; --accent: #2F5D8A; }
  :root[data-theme="dark"]  { --bg: #10151C; --surface: #171E27; --ink: #E4E9F0; --muted: #8A94A5; --line: #242D3A; --accent: #6FA8D6; }

  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; }

  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  h1 { font-size: 24px; font-weight: 650; margin: 0 0 18px; letter-spacing: -.01em; text-wrap: balance; }

  /* AUTHOR: legend — one row per held object, color swatch + name, declared once */
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .stage { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 4px; margin-bottom: 16px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 7px; }

  .caption { min-height: 3.2em; font-size: 16px; line-height: 1.5; margin-bottom: 16px; text-wrap: balance; }
  .caption .formula { font-family: var(--mono); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 4px; padding: 1px 6px; }

  .controls { display: flex; align-items: center; gap: 14px; }
  button { font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button:not(:disabled):hover { border-color: var(--accent); }

  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots span.active { background: var(--accent); width: 18px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <p class="eyebrow">concept-visualizer</p>
  <h1>{Concept title}</h1>

  <!-- AUTHOR: one <div class="item"> per held object in the metaphor -->
  <div class="legend">
    <span class="item"><span class="swatch" style="background:var(--accent)"></span>{Object A}</span>
  </div>

  <div class="stage"><canvas id="stage" width="1280" height="720"></canvas></div>
  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // AUTHOR: one entry per step. draw(ctx, t) receives t in [0,1] — the
  // animation progress INTO this step (0 = just arrived, 1 = settled).
  // caption is plain text; wrap inline math in <span class="formula">.
  const steps = [
    {
      caption: "{Step 1 caption — pure geometry, no formula}",
      draw(ctx, t) {
        // AUTHOR: draw the metaphor's starting state
      }
    },
    {
      caption: "{Step 2 caption}",
      draw(ctx, t) {
        // AUTHOR: transform the SAME objects from step 1
      }
    },
  ];

  let current = 0;
  let animStart = null;
  const DURATION = 500;

  function render(ts) {
    if (animStart === null) animStart = ts;
    const t = Math.min(1, (ts - animStart) / DURATION);
    ctx.clearRect(0, 0, W, H);
    steps[current].draw(ctx, t);
    if (t < 1) requestAnimationFrame(render);
  }

  function goTo(i) {
    current = Math.max(0, Math.min(steps.length - 1, i));
    animStart = null;
    requestAnimationFrame(render);
    document.getElementById('caption').innerHTML = steps[current].caption;
    document.getElementById('prev').disabled = current === 0;
    document.getElementById('next').disabled = current === steps.length - 1;
    document.querySelectorAll('#dots span').forEach((d, idx) =>
      d.classList.toggle('active', idx === current));
  }

  document.getElementById('dots').innerHTML =
    steps.map(() => '<span></span>').join('');
  document.getElementById('prev').onclick = () => goTo(current - 1);
  document.getElementById('next').onclick = () => goTo(current + 1);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });

  goTo(0);
</script>
